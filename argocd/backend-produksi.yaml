apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pedaree-backend-produksi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Coding-Skuy/pedaree-infra-devops.git
    path: k8s/overlays/produksi
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: pedaree-produksi
  syncPolicy:
    syncOptions: [CreateNamespace=true]
