apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pedaree-backend-pengembangan
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Coding-Skuy/pedaree-infra-devops.git
    path: k8s/overlays/pengembangan
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: pedaree-pengembangan
  syncPolicy:
    syncOptions: [CreateNamespace=true]
    automated: { prune: true, selfHeal: true }
