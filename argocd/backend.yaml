apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pedaree-backend
spec:
  project: default
  source:
    repoURL: https://github.com/Coding-Skuy/pedaree-infra-devops.git
    path: k8s
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: pedaree
  syncPolicy:
    automated: { prune: true, selfHeal: true }
