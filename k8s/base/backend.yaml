apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedaree-backend
  labels:
    app: pedaree-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedaree-backend
  template:
    metadata:
      labels:
        app: pedaree-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/coding-skuy/pedaree-backend-service:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: pedaree-db, key: url }
            # Kunci penandatangan JWT, audiens `pedaree` (akses 15 menit, refresh 7 hari).
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: pedaree-jwt, key: signing-key }
            - name: JWT_AUDIENCE
              value: pedaree
            # X-Service-Key ke TitipO (POST /sinyal/pedaree-stok); hanya untuk sinyal, bukan akses DB.
            - name: TITIPO_SERVICE_KEY
              valueFrom:
                secretKeyRef: { name: pedaree-titipo, key: service-key }
            # Daftar API key per device (satu baris per device, hash disimpan backend).
            - name: DEVICE_API_KEYS
              valueFrom:
                secretKeyRef: { name: pedaree-device-keys, key: keys }
            - name: PAWONEE_RECIPE_API
              valueFrom:
                configMapKeyRef: { name: pedaree-config, key: PAWONEE_RECIPE_API }
            - name: TITIPO_BASE_URL
              valueFrom:
                configMapKeyRef: { name: pedaree-config, key: TITIPO_BASE_URL }
          readinessProbe:
            httpGet: { path: /kesehatan, port: 8080 }
